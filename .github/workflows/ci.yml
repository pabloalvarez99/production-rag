name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy --strict

      - name: Test
        run: pytest -q
        # Prove the credential-free path: if the code silently starts requiring a key, CI goes red.
        env:
          OPENAI_API_KEY: ""
          COHERE_API_KEY: ""
          QDRANT_API_KEY: ""

      - name: Start the local vector store for offline evaluation
        run: |
          docker compose up -d qdrant
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:6333/readyz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs qdrant
          exit 1

      - name: Seed the deterministic evaluation collection
        run: >-
          python -m production_rag.ingest
          --config configs/default.yaml
          --source data/raw
          --embedder fake
          --recreate-collection
        # Prove the credential-free path: if the code silently starts requiring a key, CI goes red.
        env:
          OPENAI_API_KEY: ""
          COHERE_API_KEY: ""
          QDRANT_API_KEY: ""

      - name: Run both evaluation tiers with offline providers
        run: >-
          python -m production_rag.evals.run
          --tier all
          --embedder fake
          --llm fake
        # Prove the credential-free path: if the code silently starts requiring a key, CI goes red.
        env:
          OPENAI_API_KEY: ""
          COHERE_API_KEY: ""
          QDRANT_API_KEY: ""

      - name: Show vector-store logs after a failure
        if: failure()
        run: docker compose logs qdrant
