[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "production-rag"
version = "0.1.0"
description = "Production-grade RAG service: hybrid retrieval over Qdrant, cross-encoder reranking, grounded citations and a Ragas evaluation gate."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "qdrant",
    "hybrid-search",
    "reranking",
    "llamaindex",
    "langgraph",
    "fastapi",
    "ragas",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# Runtime dependencies: HTTP surface, configuration, logging, and — from M1 —
# the ingest path. qdrant-client and openai are here rather than in an extra
# because `make ingest-fake` runs inside the API image, which installs the base
# dependency set only; an ingest job that needs an extra to start is an ingest
# job that fails in the container.
#
# langgraph joined the base set in M4, when the query path landed. Until then it
# sat in the `rag` extra because nothing imported it; now the API's only answer
# endpoint runs on it, and an optional dependency the service cannot start
# without is not optional — it is an undeclared one.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.2",
    "structlog>=24.4",
    "httpx>=0.27",
    "qdrant-client>=1.12",
    "openai>=1.55",
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0.12",
]
# Declared, still unused: the remaining M5-M6 stack, kept here so the dependency
# decision is reviewable now. Lower bounds only — these libraries move fast and
# pinning them here would fight the lockfile that belongs in CI. langgraph left
# this extra in M4 and is a base dependency now, because the query path imports
# it unconditionally.
rag = [
    "llama-index>=0.12",
    "sentence-transformers>=3.3",
    "ragas>=0.2",
]
# The local cross-encoder reranker, and nothing else. Separate from `rag` so a
# deployment that wants reranking does not also pull LangGraph and ragas — and
# so the base install stays free of torch, which `--rerank off` never needs.
rerank = [
    "sentence-transformers>=3.3",
]
# The hosted reranker. Optional by design: a portfolio that cannot be run without
# someone else's credential is a portfolio nobody runs.
rerank-cohere = [
    "cohere>=5.11",
]
# Trace export. Optional in the strong sense: the library, the API, the CLI and
# the whole test suite run with none of it installed, and `observability.tracing`
# is off by default. Installing this changes nothing on its own — enabling it
# does, and enabling it sends prompts and answers to a third party.
obs = [
    "langfuse>=2.53",
    "opentelemetry-api>=1.28",
]

[project.scripts]
# Same entrypoint as `python -m production_rag.ingest`, for anyone who prefers a
# command to a module path.
production-rag-ingest = "production_rag.ingest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/production_rag"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
# strict mode: an async test without an explicit marker is a mistake, not a
# silently skipped test.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a reachable Qdrant; skipped unless RUN_QDRANT_TESTS=1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # pep8-naming
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "ANN",  # missing annotations
    "S",    # bandit security checks
    "B",    # bugbear
    "A",    # builtin shadowing
    "C4",   # comprehensions
    "PT",   # pytest style
    "SIM",  # simplifications
    "PTH",  # prefer pathlib
    "TID",  # tidy imports
    "RUF",  # ruff-specific
]
ignore = [
    "D107",   # __init__ docstring: the class docstring covers it
    "D203",   # incompatible with D211 (no blank line before class docstring)
    "D213",   # incompatible with D212 (summary on the first line)
    "ANN401", # Any is the honest annotation for **overrides in test factories
    # Bandit rules move between ruff releases (S104/S105/S603 stopped firing in
    # 0.16 for the lines that carry them here). The suppressions document intent
    # and keep the tree clean on an older, pinned ruff, so an unused one is not a
    # defect worth failing a build over.
    "RUF100",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests: asserts are the point, and a descriptive test name beats a docstring.
# D101/D102 for the same reason: from M2 the suites group cases into classes
# (TestSparseSearch, TestModes), and a docstring per case would restate its name.
"tests/**/*.py" = ["S101", "D100", "D101", "D102", "D103", "PLR2004"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
warn_unused_ignores = true
# The package lives under src/ and the tests are not a package, so mypy needs
# to be told where the import roots are.
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
# Optional reranker backends. They are lazily imported behind a documented
# extra, so the base environment legitimately does not have them installed and
# a missing stub here is not a type error.
module = ["sentence_transformers.*", "cohere.*", "langfuse.*", "opentelemetry.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
