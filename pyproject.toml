[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "production-rag"
version = "0.1.0"
description = "Production-grade RAG service: hybrid retrieval over Qdrant, cross-encoder reranking, grounded citations and a Ragas evaluation gate."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "qdrant",
    "hybrid-search",
    "reranking",
    "llamaindex",
    "langgraph",
    "fastapi",
    "ragas",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# Runtime dependencies for M0 only: HTTP surface, configuration, logging.
# Retrieval, embedding and evaluation libraries live in the `rag` extra so the
# API image stays small until the milestone that actually needs them.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.2",
    "structlog>=24.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0.12",
]
# Declared, deliberately unused at M0 — the stack is locked so the dependency
# decision is reviewable now, and `pip install -e ".[rag]"` is the only step
# M1 needs. Lower bounds only: these libraries move fast and pinning them here
# would fight the lockfile that belongs in CI.
rag = [
    "llama-index>=0.12",
    "langgraph>=0.2",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.3",
    "openai>=1.55",
    "ragas>=0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/production_rag"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
# strict mode: an async test without an explicit marker is a mistake, not a
# silently skipped test.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # pep8-naming
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "ANN",  # missing annotations
    "S",    # bandit security checks
    "B",    # bugbear
    "A",    # builtin shadowing
    "C4",   # comprehensions
    "PT",   # pytest style
    "SIM",  # simplifications
    "PTH",  # prefer pathlib
    "TID",  # tidy imports
    "RUF",  # ruff-specific
]
ignore = [
    "D107",   # __init__ docstring: the class docstring covers it
    "D203",   # incompatible with D211 (no blank line before class docstring)
    "D213",   # incompatible with D212 (summary on the first line)
    "ANN401", # Any is the honest annotation for **overrides in test factories
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests: asserts are the point, and a descriptive test name beats a docstring.
"tests/**/*.py" = ["S101", "D100", "D103", "PLR2004"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
warn_unused_ignores = true
# The package lives under src/ and the tests are not a package, so mypy needs
# to be told where the import roots are.
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
