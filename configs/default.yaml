# production-rag — default runtime configuration.
#
# Scope note: this file is deliberately broader than what the code consumes. A
# key existing here is not a promise that the runtime reads it yet. Each block
# below carries a `status:` comment; docs/architecture.md holds the same table.
#
# Status after M6 (evaluation):
#   ingest            LIVE
#   ingest.sparse     LIVE   BM25 vectors are written at ingest time
#   qdrant            LIVE   (dense + sparse vectors, payload indexes, consistency)
#   retrieval         LIVE   read by `python -m production_rag.retrieve` and by
#                            the query graph behind POST /v1/query
#   retrieval.filters DECLARED  no endpoint or CLI accepts `filters` yet
#   rerank            LIVE   opt-in; the `fake` provider always runs offline,
#                            `local`/`cohere` are the ones that mean anything
#   generation        LIVE   answers with [n] citations, or an explicit refusal;
#                            the `fake` provider exercises the contract offline,
#                            `openai` is the one that produces a real answer
#   evals             LIVE   both tiers run (`python -m production_rag.evals.run`);
#                            dataset_path is the only key the runner reads and the
#                            thresholds below are read by NOTHING
#   observability.logging  LIVE   structured logs, request id on every line
#   observability.tracing  LIVE   opt-in export; off by default, offline works
#   observability.metrics  DECLARED  nothing serves /metrics
#
# The whole path runs: ingest, hybrid retrieval, rerank, generation with
# citations — and, from M5, reports per-node timings on every request. From M6 it
# also measures itself offline. What is still NOT here is a defensible quality
# number: the default judge is offline and lexical, no judge has been calibrated,
# citation_precision checks the cited document rather than the cited passage, and
# no merge gate is armed. See docs/evaluation.md.
#
# Timings, invalid_markers and hits_used are OPS signals, not eval metrics: they
# say what the system did, never whether the answer was right.
#
# Precedence (lowest to highest):
#   1. this file
#   2. a profile file passed via CONFIG_PATH
#   3. environment variables (see .env.example)
#
# Secrets never live here. Only pointers to env var names.

app:
  name: production-rag
  version: 0.1.0
  environment: local # local | staging | production
  # Public base path for every versioned route. Unversioned /health stays
  # outside it so probes survive an API version bump.
  api_prefix: /v1

# ---------------------------------------------------------------------------
# Ingest — corpus to chunks to vectors.  status: LIVE (M1 dense, M2 sparse).
# ---------------------------------------------------------------------------
ingest:
  source_dir: data/raw
  processed_dir: data/processed
  # Only extensions listed here are walked; anything else is skipped loudly so
  # a silently ignored PDF never looks like an empty corpus.
  include_extensions: [".md", ".markdown", ".txt"]
  exclude_globs:
    - "**/.*"
    - "**/node_modules/**"
    # data/raw/README.md documents the corpus layout; it is not corpus. Matched
    # at the corpus root only, so a README inside someone's document set still
    # gets ingested.
    - "README.md"

  chunking:
    # Recursive splitting on structural boundaries first (headings, then
    # paragraphs, then sentences), falling back to a hard character cut.
    strategy: recursive
    chunk_size: 800 # characters, not tokens: cheaper to compute, close enough
    chunk_overlap: 120 # ~15%: enough to keep a sentence straddling a boundary
    min_chunk_chars: 120 # drop fragments that carry no retrievable signal
    separators: ["\n## ", "\n### ", "\n\n", "\n", ". ", " "]
    # Prefix each chunk with its document title + heading path before
    # embedding. Cheap, and measurably helps on short queries.
    prepend_heading_context: true

  embedding:
    # status: LIVE. The ingest job also accepts `--embedder fake`, a
    # deterministic hash embedder that overrides `provider` for a run: no key,
    # no network, no spend, same dimensionality. It exists so the ingest path is
    # runnable in CI. Its vectors are semantically meaningless — never quote a
    # retrieval number measured against a fake-embedded collection.
    provider: openai
    model: text-embedding-3-small
    dimensions: 1536
    batch_size: 128
    # Env var *name*, never the value.
    api_key_env: OPENAI_API_KEY
    max_retries: 5
    timeout_seconds: 30

  sparse:
    # status: LIVE (M2). Lexical side of the hybrid index. BM25 statistics are
    # computed over the corpus at ingest time and written as a named sparse
    # vector in the same upsert as the dense one — a point carries both or is
    # not written.
    #
    # Correction to an earlier note here: M1 did NOT declare an empty `sparse`
    # vector on the collection. It created the collection with `dense` as the
    # only named vector, so M2 is a collection MIGRATION, not a backfill. A
    # collection built by M1 must be rebuilt:
    #     make reingest-fake        # ingest --recreate-collection
    # Free on the fake embedder; a full billed re-embed on openai.
    #
    # Sparse encoding itself costs nothing per document: it is arithmetic over
    # the corpus, not a provider call. Only the dense embed is paid.
    #
    # Weights reflect the corpus as of the last FULL ingest (IDF drift). An
    # incremental run skips unchanged chunks, so their weights are exactly the
    # ones that do not get refreshed. Immaterial at this size; re-ingest fully
    # before quoting a sparse-branch number after a large corpus change.
    enabled: true
    method: bm25
    k1: 1.2
    b: 0.75
    lowercase: true
    # Empty means "language default"; set explicitly when the corpus is not
    # English, because a wrong stopword list quietly degrades recall.
    stopwords: english

  # Skip re-embedding chunks whose content hash is unchanged. Ingest is the
  # only place this project spends real money, so incremental is the default.
  incremental: true
  hash_algorithm: sha256

# ---------------------------------------------------------------------------
# Retrieval — hybrid dense + sparse, fused with RRF.
# status: LIVE (M2). Read by `python -m production_rag.retrieve` (make
# retrieve-fake / scripts/retrieve.ps1) and, from M4, by the query graph behind
# POST /v1/query. Downstream of fusion there is a rerank stage (M3, opt-in, see
# the `rerank` block) and then generation (M4, see the `generation` block).
# ---------------------------------------------------------------------------
retrieval:
  # dense  — embedding kNN only; the honest setting when the collection has no
  #          sparse vector, and the way to ask for dense-only on purpose.
  # sparse — BM25 only; useful for attributing a regression to one branch.
  # hybrid — both, fused. Aborts if the collection carries no `sparse` vector,
  #          rather than degrading silently to dense-only.
  mode: hybrid # dense | sparse | hybrid
  # Candidates pulled from each branch before fusion. Deliberately larger than
  # top_k: fusion can only reorder what it was given.
  dense_top_k: 40
  sparse_top_k: 40
  # Documents handed to the next stage (rerank if enabled, else generation).
  top_k: 12
  fusion:
    method: rrf # reciprocal rank fusion — score-scale agnostic
    # score(doc) = sum over branches of  weight / (k + rank), rank 1-based.
    # A document missing from a branch contributes nothing from that branch.
    k: 60 # RRF smoothing constant; standard value from the original paper.
    #     Large k damps the gap between top ranks: rank 1 -> 1/61, rank 2 ->
    #     1/62. A branch that is confidently wrong cannot dominate.
    # Relative pull of each branch. Equal weights until evals say otherwise;
    # tuning these by intuition is how a fusion config stops being explainable.
    dense_weight: 1.0
    sparse_weight: 1.0
  # Hard floor applied AFTER fusion, to the RRF score — which is a function of
  # rank positions, not of similarity. With two branches and k=60 the maximum is
  # 2/61 ~= 0.0328, and a single-branch rank-1 hit scores ~0.0164. So this
  # filters by "found by both branches, high up", not by relevance. 0.0 disables
  # it; raise only with eval evidence, and expect refusals to spike first.
  score_threshold: 0.0
  # Payload keys returned with each hit. Keep this tight: every extra field is
  # tokens in the generation prompt.
  return_payload_fields: [doc_id, chunk_id, title, source_path, heading_path, text]
  filters:
    # status: DECLARED ONLY. Nothing reads this yet. Neither POST /v1/query nor
    # the CLI accepts a `filters` field — a request carrying one is rejected with
    # 422 as an unknown field, which is the honest answer while the allowlist is
    # unwired: silently dropping a filter would answer a different question than
    # the one asked. When it lands, keep it in sync with qdrant.payload_indexes;
    # an unindexed filter degrades to a payload scan.
    allowed_fields: [source, title, tags, created_at]

# ---------------------------------------------------------------------------
# Rerank — cross-encoder pass over the fused candidates.
# status: LIVE (M3), opt-in. Read by `python -m production_rag.retrieve`; the
# `--rerank` flag switches one run, this block switches a deployment.
#
# Why this stage exists: RRF orders by RANK, never magnitude, and neither branch
# ever reads the query and the passage together — the dense branch compares two
# separately produced vectors, the sparse branch sums per-term weights. A
# cross-encoder reads the pair in one forward pass, which is why it is accurate
# and why it cannot be indexed. Retrieval owns recall; this stage owns precision
# at the top. It never queries Qdrant and never adds a document fusion did not
# return. Rationale: docs/adr/0004-rerank-cross-encoder.md.
#
# Honest scope: the rerank PLUMBING runs anywhere, including with the `fake`
# provider on a laptop with no credentials. Rerank QUALITY exists only on
# `local-cross-encoder` or `cohere`. Same distinction as the fake embedder, one
# stage later — never quote an ordering number produced by `fake`.
#
# Still not here: generation. This stage reorders passages; it is the last stage
# of retrieval, not the first stage of an answer. That is M4.
# ---------------------------------------------------------------------------
rerank:
  # The default is off, so M2 behaviour is what you get unless you ask for more.
  # `--rerank auto` is what makes this switch (and `provider` below) authoritative
  # for a run; `--rerank fake|local|cohere|off` overrides both for one command.
  enabled: false
  # cohere | local-cross-encoder | fake | none
  #   local-cross-encoder  the project's default CHOICE: CPU cross-encoder, no
  #                        per-query spend, no passage leaves the machine. Needs
  #                        `pip install -e ".[rerank]"` and a ~1.1 GB download on
  #                        first use — bake it into the image or mount a warm
  #                        cache, or the first request pays for it.
  #   cohere               hosted swap for targets that cannot host a model.
  #                        Needs `.[rerank-cohere]` and COHERE_API_KEY.
  #   fake                 deterministic query-term overlap. Offline plumbing
  #                        double, NOT a quality claim.
  #   none                 same as disabling the stage.
  provider: cohere
  model: rerank-english-v3.0 # used by the cohere provider
  # Env var *name*, never the value.
  api_key_env: COHERE_API_KEY
  # Weights for the local provider. Named here rather than hard-coded so
  # swapping the model is a config diff an eval run can be attributed to.
  local_model: BAAI/bge-reranker-base
  # Feed the reranker MORE than you keep. This asymmetry is the design: handing
  # it exactly `top_k` makes it a no-op sorter of an already-final list, while 40
  # lets it lift a passage fusion buried at rank 30 into position 2. Cost is
  # linear in this number (40 candidates = 40 forward passes, or 40 passages on
  # the wire), so it is the stage's price dial. Raising it above what fusion
  # returned (retrieval.dense_top_k + retrieval.sparse_top_k) buys nothing.
  # The flip side: with rerank on, a chunk outside this window is unreachable by
  # construction — which is why the result reports how many candidates it saw.
  input_top_k: 40
  # Hits kept after reranking.
  top_k: 6
  timeout_seconds: 15
  # If the reranker errors or times out, fall through to fusion order rather
  # than failing the request. Availability beats a few points of nDCG: the
  # un-reranked result is correct in kind, only ordered worse.
  #
  # Deliberately the opposite of how a MISSING CAPABILITY is treated — a
  # collection with no `sparse` vector aborts, because the system would otherwise
  # be silently unhybrid. A missing improvement is not a missing capability.
  #
  # Never silent either way: the result carries `rerank: {applied, reranker,
  # candidates, error}`, and a swallowed failure is logged at warning level.
  # Set false when you would rather fail the request than serve un-reranked
  # hits — and accept that a provider outage is then an outage.
  fail_open: true

# ---------------------------------------------------------------------------
# Generation — answer synthesis with mandatory citations.
# status: LIVE (M4). Read by the query graph behind POST /v1/query and by
# `python -m production_rag.query`. This is the first stage that returns prose
# rather than passages, which is the point at which the system becomes able to be
# confidently wrong — hence the citation contract and the refusal edge below.
# Rationale: docs/adr/0005-grounded-generation.md.
#
# Honest scope, third instance of the same pattern in this file: the generation
# CONTRACT runs anywhere, including with the `fake` provider on a laptop with no
# credentials. Answer QUALITY exists only on `openai`. Same distinction as the
# fake embedder and the fake reranker, one stage later.
#
# Still NOT here: any measured answer quality. No faithfulness number, no
# citation-precision number, no judge. That is M6 — docs/evaluation.md.
# ---------------------------------------------------------------------------
generation:
  # openai | fake
  #   openai  the real path: a hosted model reads the passages and answers.
  #   fake    deterministic extractive stitching of the top passages, emitting
  #           [n] markers that resolve. Offline contract double, NOT a quality
  #           claim: it does not reason and cannot synthesise across passages.
  provider: openai
  model: gpt-4o-mini
  # Env var *name*, never the value.
  api_key_env: OPENAI_API_KEY
  temperature: 0.1 # near-deterministic: this is extraction, not authoring
  max_output_tokens: 800
  # Budget for retrieved context. Chunks are dropped from the tail once this
  # is exceeded, so retrieval order is also truncation order — which makes the
  # rerank stage decide what the model may cite, not merely in what order.
  max_context_tokens: 6000
  timeout_seconds: 60
  max_retries: 3
  # A true flag for behaviour that does not exist is the same failure class as
  # presenting a DECLARED block as live. The query path returns whole answers.
  stream: false
  # Note there is deliberately no `fail_open` here, unlike the rerank block. A
  # failed reranker leaves a result that is correct in kind and ordered worse; a
  # failed generator leaves nothing to substitute except an ungrounded answer,
  # which is the exact thing this stage exists to refuse. Generation failures
  # surface as 503 after the bounded retries above.

  citations:
    enabled: true
    # Inline markers referencing the ordinal of a retrieved chunk, e.g. [2].
    # The ordinal is scoped to ONE request — it indexes the passages that
    # request sent, and identifies nothing outside the response. What is durable
    # is the chunk_id inside the resolved Citation. See docs/data-model.md.
    #
    # A marker outside the supplied range (e.g. [9] when 8 passages were sent)
    # is stripped from the answer text and recorded in `invalid_markers` on the
    # library result, never rendered as a dead link. Surviving markers are not
    # renumbered.
    style: bracketed_index
    # An answer with no resolvable citation is not served as prose: it is either
    # the model ignoring its context or a claim the context does not support.
    require_citation: true
    # When the context does not support an answer, say so instead of guessing.
    # This is the single highest-leverage setting for perceived quality.
    #
    # Enforced by the GRAPH, not by the prompt: when nothing clears the evidence
    # bar the generate node is never entered and no token is spent. Asking the
    # model to refuse when appropriate would delegate the judgement to the
    # component whose known failure mode is exactly that judgement.
    refuse_without_evidence: true
    # Clients branch on the `refused` boolean in the response, never on this
    # string — it is config and it is meant to be changed per deployment.
    refusal_message: >-
      I could not find support for that in the indexed documents.

  prompt:
    # The system prompt is a FILE, not a string in code: changing it changes
    # system behaviour and belongs in a diff with an eval run attached.
    system_path: configs/prompts/system.md
    include_heading_path: true
    # Deliberately above rerank.top_k (6), so the rerank cut binds when that
    # stage is on and this budget binds when it is off (fusion returns
    # retrieval.top_k = 12).
    max_chunks_in_prompt: 8

# ---------------------------------------------------------------------------
# Qdrant — vector store topology.  status: LIVE. Both named vectors are created
# and written as of M2. A collection created by M1 has `dense` only and must be
# rebuilt (`make reingest-fake`); it cannot be upgraded in place.
# ---------------------------------------------------------------------------
qdrant:
  # Overridden by QDRANT_URL. Inside compose that is http://qdrant:6333.
  url: http://localhost:6333
  collection: production_rag
  api_key_env: QDRANT_API_KEY # unset locally; required for Qdrant Cloud
  prefer_grpc: false # REST for local debuggability; gRPC for bulk ingest
  timeout_seconds: 30

  vectors:
    dense:
      name: dense
      size: 1536 # must match ingest.embedding.dimensions
      distance: Cosine
    sparse:
      # status: LIVE (M2). Created with the collection from M2 onward. It was
      # NOT declared by M1 — that claim was wrong and is why upgrading an M1
      # collection needs --recreate-collection rather than a backfill.
      name: sparse
      # No `size`: a sparse vector is index/value pairs, only the terms present
      # in the chunk. Nothing here has to match ingest.embedding.dimensions.
      #
      # `none`, NOT `idf`, and this one matters. Ingest stores FULL BM25 weights
      # with IDF already folded in, so the dot product of query and document
      # vector is exactly the BM25 score. Qdrant's `idf` modifier would apply IDF
      # a second time and square the term -- rare tokens would dominate far
      # beyond what BM25 says. An earlier revision of this file said `idf`; it
      # was wrong. See production_rag.retrieval.sparse.
      modifier: none

  hnsw:
    m: 16
    ef_construct: 128
    full_scan_threshold: 10000 # below this, brute force is faster than HNSW
  search:
    hnsw_ef: 128 # search-time breadth; raise for recall, costs latency

  optimizers:
    default_segment_number: 2
    indexing_threshold: 20000
  # Payload fields that get a keyword index so filters stay O(log n).
  payload_indexes:
    - field: doc_id
      schema: keyword
    - field: source
      schema: keyword
    - field: tags
      schema: keyword

  on_disk_payload: true
  # Ingest writes: wait for the operation to be applied before returning, so a
  # smoke test right after ingest cannot read a half-built index.
  write_consistency: wait

# ---------------------------------------------------------------------------
# Evals — offline quality measurement.  status: LIVE (M6) for both tiers,
# DECLARED for almost every key below.  Rationale: docs/adr/0003-eval-strategy.md.
#
# What is LIVE: the golden set at `dataset_path` (17 items, document-level
# labels) and `python -m production_rag.evals.run --tier 1|2|all`, wired as
# `make eval-tier1` / `eval-tier2-fake` / `eval-all-fake`. Tier 1 reports
# source_hit_at_k, source_recall_at_k, mrr and ndcg_at_k; tier 2 reports
# citation_precision, invalid_marker_rate and refusal_accuracy without a judge,
# plus faithfulness and relevance from one. Defaults are offline (fake embedder,
# fake model, fake judge), so the default run is free, deterministic and a
# PLUMBING check — the report says so in `offline_defaults`.
#
# What the runner actually reads from this block: `dataset_path` only, and only
# as a default that `--golden` overrides. Tier, k, sample, seed, embedder, model,
# judge and rerank are CLI flags, so a run is described by its invocation and its
# report rather than by whichever profile happened to be loaded.
#
# The metric names here are the ADR's chunk-level ones. What runs is the
# source-level equivalent, because the golden set labels documents, not chunks —
# see docs/evaluation.md#retrieval-metrics.
#
# The thresholds below are READ BY NOTHING and are NOT baseline-derived. The only
# gate is the runner's `--fail-under-hit` flag on source_hit_at_k, default 0.0
# (report only). Replace these values with measured numbers from a recorded
# baseline; do not adjust them toward one. See docs/evaluation.md#thresholds.
# ---------------------------------------------------------------------------
evals:
  # Read (as a default) by the runner. Everything below it is not.
  dataset_path: data/eval/golden.jsonl
  results_dir: data/processed/eval-runs
  # Retrieval metrics are computed from the golden labels; answer metrics can use
  # an LLM judge, which costs money, hence the separate switch.
  retrieval:
    enabled: true
    # The ADR's names. The implementation computes the source-level equivalents
    # (source_hit_at_k, source_recall_at_k, mrr, ndcg_at_k) because
    # `relevant_chunk_ids` labels do not exist yet — chunk-level labels wait for
    # chunking to settle, since a chunk-size change repoints them silently
    # instead of breaking them loudly. ndcg uses binary gain: no item carries the
    # graded `relevance` field.
    metrics: [recall@k, mrr, ndcg@k]
    k_values: [1, 3, 5, 10]
  answer:
    # Not a switch the runner reads. Tier 2 runs when `--tier 2` or `--tier all`
    # is passed; the judge is chosen with `--judge`, and a hosted one needs
    # RUN_LLM_EVALS=1 and a credential on top of the flag.
    enabled: false
    judge_provider: openai
    judge_model: gpt-4o
    metrics: [faithfulness, answer_relevance, citation_precision]
    # Judge runs are sampled to keep cost bounded (`--sample`). The sample size
    # belongs next to any score quoted from it — a judged number without its n is
    # an adjective. The runner's default is every case, because 17 < 50.
    sample_size: 50
  # Placeholders, read by nothing. A threshold becomes real when something
  # computes the metric it names AND a baseline run has set its value; neither is
  # true today. Lowering an armed threshold to make a build pass belongs in an
  # ADR, not a commit.
  thresholds:
    recall_at_5: 0.80
    mrr: 0.65
    faithfulness: 0.90
  # Fixed seed so two sampled runs over the same dataset are comparable. The
  # runner takes it as `--seed` and echoes it in the report.
  seed: 42

# ---------------------------------------------------------------------------
# Observability — structured logs and per-node timings, always; traces on
# request.  status: LIVE (M5) for logging and tracing; metrics still declared.
# Rationale: docs/adr/0006-observability.md.
#
# What is NOT configurable here, on purpose: per-node timings. Every graph node
# is timed on every request, with no flag and no sampling, because the cost is
# one perf_counter pair per stage and a breakdown that exists only when someone
# remembered to enable it is missing exactly when it is needed. The numbers land
# on the library result (`timings_ms`, rendered as `latency_ms`), in the
# `query_completed` log line, and — only with `debug: true` — in a `diagnostics`
# object on the HTTP response.
#
# `debug` is CALLER-controlled, so it exposes only what would be safe to
# publish: timings, hit counts, the rerank summary, invalid_markers. Never the
# collection name, the embedder, the model, or any prompt or passage text.
#
# Fourth instance of the honest-scope pattern in this file: the signals are real
# everywhere, but numbers produced by the `fake` providers measure the plumbing.
# A `--llm fake` run has no provider call in `generate` at all.
# ---------------------------------------------------------------------------
observability:
  logging:
    # status: LIVE. structlog, one request id bound in the middleware and
    # therefore on every line the request emits — the join key between the
    # access log, the retrieval calls, the rerank warning and the LLM call.
    level: INFO # overridden by LOG_LEVEL
    format: json # json in containers, console for local TTY debugging
    # Never log prompt or document text. This is the cheapest data leak this
    # system offers and it produces no error: the prompt carries retrieved
    # corpus text VERBATIM, so an aggregator with these on becomes a full copy
    # of the corpus with none of its access controls, readable by everyone with
    # a dashboard login and retained for months.
    #
    # Local debugging session on a corpus you own, on a machine whose logs go
    # nowhere. Never a deployment. Treat any archive written while they were on
    # as a copy of the corpus.
    log_prompts: false
    log_retrieved_text: false
    # Note one deliberate exception, called out because it is one: the QUESTION
    # text is logged in `query_completed`. It is user-supplied rather than
    # corpus content and it is what makes a report correlatable — but a
    # deployment handling sensitive questions should drop that field at the
    # aggregator rather than losing the event.
    include_request_id: true

  tracing:
    # status: LIVE (M5) as an OPT-IN EXPORT — off by default, and the whole
    # system is complete without it. Every command, the endpoint, the CLI, the
    # tests and the eval script run offline with nothing here configured; a
    # laptop with no credentials is this project's reference environment.
    #
    # Fail-open, in the same sense as rerank.fail_open: a trace backend that is
    # down, slow or misconfigured loses a diagnostic, never a request. If traces
    # stop appearing, check the logs before assuming requests are failing.
    #
    # Enabling this sends PROMPTS AND ANSWERS to a third party — that is what a
    # generation trace is, and `sample_rate` bounds volume, not sensitivity. It
    # is a decision about where corpus text may go, not a toggle. Self-hosting
    # changes nothing except `host_env`.
    enabled: false
    provider: langfuse
    # Env var *names*, never values. Tracing stays off unless all three resolve;
    # a partial configuration does not half-enable it.
    public_key_env: LANGFUSE_PUBLIC_KEY
    secret_key_env: LANGFUSE_SECRET_KEY
    host_env: LANGFUSE_HOST
    sample_rate: 1.0

  metrics:
    # status: DECLARED ONLY. Nothing serves /metrics yet. A true flag for
    # behaviour that does not exist is the same failure class as presenting a
    # DECLARED block as live. Kept because the bucket
    # choice is the part worth deciding once: retrieval is tens of ms and
    # generation is seconds, so a default linear histogram would put every real
    # request in one bucket.
    #
    # Per-request latency is live and is a different question from fleet
    # latency; this block is the latter, and so is anything about behaviour
    # under concurrency. Cost and token accounting are not here either — the
    # provider reports token counts and nothing aggregates them yet.
    enabled: false
    # Prometheus-compatible exposition on the API itself.
    path: /metrics
    latency_buckets_seconds: [0.1, 0.25, 0.5, 1, 2, 5, 10, 30]

  health:
    liveness_path: /health
    readiness_path: /v1/health
    # Readiness checks its dependencies; liveness must not, or a Qdrant blip
    # would get the API container killed by the orchestrator.
    readiness_checks: [qdrant]
